<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mj-p,.mj-p *{box-sizing:border-box}
.mj-p{--E:cubic-bezier(.45,0,.2,1);position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:#0D0E10;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mj-sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.mj-sc::-webkit-scrollbar{display:none}
.mj-vg{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(120% 90% at 50% 42%,rgba(20,18,16,0) 55%,rgba(20,18,16,.08) 80%,rgba(20,18,16,.20) 100%)}
.go .mj-vg{animation:mj-habille 1.4s ease-in-out .2s both}
.mj-mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#4B4D52}
.mj-ser{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}

/* écriture */
.mj-w{position:relative;display:inline-block;white-space:nowrap}
.mj-w .o{display:block;color:transparent;-webkit-text-stroke:1px currentColor;clip-path:inset(-12px 100% -12px 0)}
.mj-w .f{position:absolute;left:0;top:-.24em;padding:.24em .14em .24em 0;background-color:currentColor;background-image:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(255,255,255,.07) 45%,rgba(255,255,255,0)),url(/_blob/ed07de6673f5b97f3f81d1a4ab4817c0);background-size:70% 60%,120px 120px;background-repeat:no-repeat,repeat;background-position:18% 12%,0 0;background-blend-mode:screen,overlay;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;clip-path:inset(-12px 100% -12px 0)}
.mj-tete{position:absolute;left:0;top:50%;width:0;height:0;border-radius:0;background:#0D0E10;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1.5px 0 rgba(0,0,0,.22),0 2px 5px rgba(13,14,16,.22)}
.rv .mj-w .o{animation:mj-wIn var(--u,.6s) var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.rv .mj-w .f{animation:mj-wIn var(--u,.6s) var(--E) calc(var(--b,0s) + var(--d,0s) + .25s) both}
.rv .mj-tete{animation:mj-ne .22s var(--E) max(0s,calc(var(--b,0s) + var(--d,0s) - .22s)) both,mj-ecrit var(--u,.6s) var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.mj-rule{clip-path:inset(-4px 100% -4px 0)}
.rv .mj-rule{animation:mj-wIn .3s var(--E) calc(var(--b,0s) + .1s) both}

/* traits */
.mj-ln path,.mj-ln rect{fill:none;stroke:#0D0E10;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 102;stroke-dashoffset:101}
.rv .mj-ln path,.rv .mj-ln rect{animation:mj-drawS var(--u,.45s) var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.mj-hl{display:block;overflow:visible}
.mj-hl path{stroke-width:1px;stroke:rgba(13,14,16,.24)}
.mj-ln path.mj-com{stroke-dasharray:6 94;stroke-dashoffset:0;stroke-opacity:0}
.rv .mj-ln path.mj-com{animation:mj-apparait 1.8s ease-in-out 3.4s both,mj-comete 14s linear 3.4s infinite}

/* photo du dossier : cadre tracé, puis développement noir et blanc -> couleur */
.mj-ph{position:absolute;filter:drop-shadow(0 14px 16px rgba(20,18,16,.26)) drop-shadow(0 4px 5px rgba(20,18,16,.14))}
.mj-img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;clip-path:inset(0 100% 0 0)}
.rv .mj-img{animation:mj-rIn .8s var(--E) calc(var(--b,0s) + var(--d,0s)) both,mj-dev 3.2s ease-in-out calc(var(--b,0s) + var(--d,0s)) both}
.rv .mj-img.nb{animation:mj-rIn .8s var(--E) calc(var(--b,0s) + var(--d,0s)) both,mj-devNB 3.2s ease-in-out calc(var(--b,0s) + var(--d,0s)) both}
.mj-fr{position:absolute;inset:-6px;overflow:visible;pointer-events:none}
.mj-fr rect{fill:none;stroke:#0D0E10;stroke-width:1.5px;stroke-linecap:round;stroke-dasharray:100 102;stroke-dashoffset:101}
.rv .mj-fr rect{animation:mj-trace 1.5s var(--E) calc(var(--b,0s) + var(--d,0s) - .45s) both}

/* matière */
.mj-glass{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(250,248,244,.86) 55%,rgba(240,237,231,.9) 100%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 16px 32px -12px rgba(20,18,16,.30),0 4px 10px -3px rgba(20,18,16,.16),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,18,16,.06),inset 0 -12px 18px -12px rgba(20,18,16,.10);opacity:0}
.rv .mj-glass{animation:mj-habille 1.8s ease-in-out calc(var(--b,0s) + var(--d,0s) + .5s) both}
.mj-btnw{filter:drop-shadow(0 12px 12px rgba(13,14,16,.38)) drop-shadow(0 3px 4px rgba(13,14,16,.22))}
.mj-cta{display:flex;align-items:center;justify-content:center;border:0;color:#F4F2EE;font:600 15px Inter,sans-serif;cursor:pointer;width:100%;height:100%;background:radial-gradient(35% 25% at 30% 20%,rgba(255,255,255,.14),rgba(255,255,255,0)),url(/_blob/ed07de6673f5b97f3f81d1a4ab4817c0),#0D0E10;background-blend-mode:normal,overlay,normal;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1.5px 0 rgba(0,0,0,.6);clip-path:inset(0 100% 0 0 round 26px)}
.rv .mj-cta{animation:mj-rBtn .45s var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.mj-tap{position:absolute;background:none;border:0;padding:0;cursor:pointer;display:block;text-align:left;color:inherit;font:inherit}
.mj-tap:focus-visible,.mj-link:focus-visible{outline:2px solid #0D0E10;outline-offset:2px;border-radius:12px}
.mj-link{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0;background:none;border:0;cursor:pointer;font:500 14px Inter,sans-serif;color:#0D0E10}

/* mini-suivi */
.mj-node{position:absolute;top:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;border:1.5px solid #0D0E10}
.mj-node.on{background:#0D0E10}

/* sortie */
.out .rv .mj-w .o,.out .rv .mj-w .f{animation:mj-wOut .2s var(--E) 0s both}
.out .rv .mj-tete{animation:none}
.out .rv .mj-ln path,.out .rv .mj-ln rect{animation:mj-undrawS .3s var(--E) 0s both}
.out .rv .mj-ln path.mj-com{animation:none;stroke-opacity:0}
.out .rv .mj-img{animation:mj-devOut .25s var(--E) 0s both}
.out .rv .mj-fr rect{animation:none}
.out .rv .mj-glass{animation:mj-deshabille .3s ease both}
.out .rv .mj-cta{animation:mj-rBtnOut .3s var(--E) 0s both}
.out .rv .mj-rule{animation:mj-wOut .2s var(--E) 0s both}
.out .mj-vg{animation:mj-deshabille .3s ease both}

@keyframes mj-wIn{from{clip-path:inset(-12px 100% -12px 0)}to{clip-path:inset(-12px -12px -12px 0)}}
@keyframes mj-wOut{from{clip-path:inset(-12px -12px -12px 0)}to{clip-path:inset(-12px 100% -12px 0)}}
@keyframes mj-rIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mj-rBtn{from{clip-path:inset(0 100% 0 0 round 26px)}to{clip-path:inset(0 0 0 0 round 26px)}}
@keyframes mj-rBtnOut{from{clip-path:inset(0 0 0 0 round 26px)}to{clip-path:inset(0 100% 0 0 round 26px)}}
@keyframes mj-drawS{from{stroke-dashoffset:101}to{stroke-dashoffset:0}}
@keyframes mj-undrawS{from{stroke-dashoffset:0}to{stroke-dashoffset:101}}
@keyframes mj-trace{0%{stroke-dashoffset:101}50%{stroke-dashoffset:0}65%{stroke-dashoffset:0}100%{stroke-dashoffset:-102}}
@keyframes mj-dev{0%{opacity:0;filter:grayscale(1) contrast(1.05)}38%{opacity:1;filter:grayscale(1) contrast(1.05)}100%{opacity:1;filter:grayscale(0) contrast(1)}}
@keyframes mj-devNB{0%{opacity:0;filter:grayscale(1) contrast(1.05)}45%{opacity:1;filter:grayscale(1) contrast(1.05)}100%{opacity:1;filter:grayscale(1) contrast(1.05)}}
@keyframes mj-devOut{0%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
@keyframes mj-habille{from{opacity:0}to{opacity:1}}
@keyframes mj-deshabille{from{opacity:1}to{opacity:0}}
@keyframes mj-apparait{from{stroke-opacity:0}to{stroke-opacity:1}}
@keyframes mj-comete{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes mj-ne{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes mj-ecrit{0%{left:-14px;top:calc(50% - 5px);width:10px;height:10px;border-radius:5px}15%{left:-2px;top:0;width:3px;height:100%;border-radius:1.5px}85%{left:calc(100% - 2px);top:0;width:3px;height:100%;border-radius:1.5px}100%{left:100%;top:50%;width:0;height:0;border-radius:0}}
@media (prefers-reduced-motion: reduce){.mj-p *{animation-duration:0s !important;animation-delay:0s !important;transition-duration:0s !important}}
</style>
</helmet>
<div class="mj-p {{rcls}}" ref="{{rootRef}}">
  <div class="mj-vg" aria-hidden="true"></div>
  <div class="mj-sc" ref="{{scRef}}" onScroll="{{scroll}}">
    <div class="mj-c {{pc}}" style="padding:96px 22px 190px;position:relative">

      <div data-rv="" style="display:flex;align-items:center;gap:12px">
        <span class="mj-rule" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="mj-mono"><span class="mj-w" style="--d:.15s;--u:.6s"><span class="o">Espace client · {{who}}</span><span class="f" aria-hidden="true">Espace client · {{who}}</span></span></span>
      </div>
      <div style="margin-top:14px;font-weight:300;font-size:38px;line-height:1.1;letter-spacing:-.035em;filter:drop-shadow(0 6px 8px rgba(20,18,16,.16))">
        <div data-rv=""><span class="mj-w" style="--d:.1s;--u:.8s"><span class="mj-tete"></span><span class="o">Mes <span class="mj-ser" style="font-size:44px">dossiers.</span></span><span class="f" aria-hidden="true">Mes <span class="mj-ser" style="font-size:44px">dossiers.</span></span></span></div>
      </div>
      <div data-rv="" style="margin-top:12px;font:400 15px/1.7 Inter,sans-serif;color:#4B4D52">
        <div><span class="mj-w" style="--d:.2s;--u:.7s"><span class="o">{{introA}}</span><span class="f" aria-hidden="true">{{introA}}</span></span></div>
        <div><span class="mj-w" style="--d:.45s;--u:.7s"><span class="o">{{introB}}</span><span class="f" aria-hidden="true">{{introB}}</span></span></div>
      </div>

      <!-- LE DOSSIER : précomplété depuis le simulateur -->
      <sc-if value="{{hasDraft}}" hint-placeholder-val="{{true}}">
        <div data-rv="" style="margin-top:26px;position:relative;height:430px">
          <div class="mj-glass" style="position:absolute;inset:0;border-radius:26px;--d:.9s"></div>
          <svg class="mj-ln" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="346" height="430" viewBox="0 0 346 430" aria-hidden="true">
            <path pathLength="100" d="M0 215 V26 A26 26 0 0 1 26 0 H320 A26 26 0 0 1 346 26 V215" style="--d:.1s;--u:.9s"/>
            <path pathLength="100" d="M0 215 V404 A26 26 0 0 0 26 430 H320 A26 26 0 0 0 346 404 V215" style="--d:.1s;--u:.9s"/>
            <path class="mj-com" pathLength="100" d="M0 215 V26 A26 26 0 0 1 26 0 H320 A26 26 0 0 1 346 26 V404 A26 26 0 0 1 320 430 H26 A26 26 0 0 1 0 404 Z" style="stroke:#3AA6B5"/>
          </svg>

          <!-- photo : cadre tracé, puis développement -->
          <div class="mj-ph" style="left:22px;top:22px;width:302px;height:150px;--d:.95s">
            <img class="mj-img {{nb}}" src="{{src}}" alt="{{alt}}" style="object-position:{{pos}}">
            <svg class="mj-fr" width="314" height="162" viewBox="0 0 314 162" aria-hidden="true"><rect x="0" y="0" width="314" height="162" pathLength="100"/></svg>
          </div>

          <!-- tout le haut de la carte ouvre le dossier -->
          <button class="mj-tap" onClick="{{open}}" aria-label="Ouvrir mon dossier" style="left:0;top:0;width:346px;height:326px"></button>

          <div style="position:absolute;left:22px;right:22px;top:188px;pointer-events:none">
            <div class="mj-mono" style="font-size:10px"><span class="mj-w" style="--d:1.5s;--u:.5s"><span class="o">{{status}}</span><span class="f" aria-hidden="true">{{status}}</span></span></div>
            <div style="margin-top:6px;font:600 23px/1.15 Inter,sans-serif;letter-spacing:-.025em;filter:drop-shadow(0 4px 6px rgba(20,18,16,.14))"><span class="mj-w" style="--d:1.65s;--u:.6s"><span class="mj-tete"></span><span class="o">{{svcT}}</span><span class="f" aria-hidden="true">{{svcT}}</span></span></div>
            <div style="margin-top:8px;font:400 14px/1.45 Inter,sans-serif;height:41px;overflow:hidden;color:#4B4D52">{{recap}}</div>
          </div>
          <div style="position:absolute;left:22px;right:22px;top:288px;display:flex;align-items:baseline;justify-content:space-between;pointer-events:none">
            <span style="font:300 26px/1 Inter,sans-serif;letter-spacing:-.035em"><span class="mj-w" style="--d:2s;--u:.6s"><span class="o">{{priceL}} {{ttc}}</span><span class="f" aria-hidden="true">{{priceL}} {{ttc}}</span></span></span>
          </div>
          <!-- avancement du dossier -->
          <div style="position:absolute;left:30px;right:30px;top:330px;height:34px;pointer-events:none">
            <svg class="mj-ln mj-hl" style="position:absolute;left:0;top:5px" width="286" height="2" viewBox="0 0 286 2" aria-hidden="true"><path pathLength="100" d="M0 1H286" style="--d:1.8s;--u:.8s"/></svg>
            <span class="mj-node on" style="left:6px"></span><span class="mj-node {{n1}}" style="left:97px"></span><span class="mj-node" style="left:189px"></span><span class="mj-node" style="left:280px"></span>
            <span class="mj-mono" style="position:absolute;top:18px;left:6px;margin-left:-35px;width:70px;text-align:center;font-size:9px;letter-spacing:.06em;color:#0D0E10">Brouillon</span><span class="mj-mono" style="position:absolute;top:18px;left:97px;margin-left:-35px;width:70px;text-align:center;font-size:9px;letter-spacing:.06em;color:{{c1}}">Soumis</span><span class="mj-mono" style="position:absolute;top:18px;left:189px;margin-left:-35px;width:70px;text-align:center;font-size:9px;letter-spacing:.06em">Accepté</span><span class="mj-mono" style="position:absolute;top:18px;left:280px;margin-left:-35px;width:70px;text-align:center;font-size:9px;letter-spacing:.06em">Confirmé</span>
          </div>

          <div style="position:absolute;left:22px;right:22px;top:372px;display:flex;gap:10px;align-items:center">
            <div class="mj-btnw" style="flex:1;height:52px"><button class="mj-cta" style="--d:2.2s" onClick="{{open}}"><span class="mj-w" style="--d:2.5s;--u:.5s"><span class="o">{{ctaL}}</span><span class="f" aria-hidden="true">{{ctaL}}</span></span></button></div>
            <sc-if value="{{canEdit}}" hint-placeholder-val="{{true}}">
              <div style="position:relative;width:88px;height:52px;flex:none">
                <svg class="mj-ln" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="88" height="52" viewBox="0 0 88 52" aria-hidden="true"><rect x="0.75" y="0.75" width="86.5" height="50.5" rx="25" pathLength="100" style="--d:2.3s;--u:.6s"/></svg>
                <button class="mj-link" onClick="{{edit}}" style="position:absolute;inset:0;justify-content:center;width:100%;height:100%"><span class="mj-w" style="--d:2.6s;--u:.4s"><span class="o">Modifier</span><span class="f" aria-hidden="true">Modifier</span></span></button>
              </div>
            </sc-if>
          </div>
        </div>

        <div data-rv="" style="margin-top:22px">
          <svg class="mj-ln mj-hl" width="346" height="2" viewBox="0 0 346 2" aria-hidden="true"><path pathLength="100" d="M0 1H346" style="--d:.1s;--u:.9s"/></svg>
          <div style="display:flex;align-items:center;justify-content:space-between;height:56px">
            <span class="mj-mono"><span class="mj-w" style="--d:.3s;--u:.6s"><span class="o">Aucun autre dossier</span><span class="f" aria-hidden="true">Aucun autre dossier</span></span></span>
            <button class="mj-link" onClick="{{fresh}}"><span class="mj-w" style="--d:.5s;--u:.5s"><span class="o">Nouveau devis</span><span class="f" aria-hidden="true">Nouveau devis</span></span></button>
          </div>
          <svg class="mj-ln mj-hl" width="346" height="2" viewBox="0 0 346 2" aria-hidden="true"><path pathLength="100" d="M0 1H346" style="--d:.4s;--u:.9s"/></svg>
        </div>
      </sc-if>

      <!-- aucun dossier -->
      <sc-if value="{{noDraft}}" hint-placeholder-val="{{false}}">
        <div data-rv="" style="margin-top:34px">
          <div class="mj-btnw" style="width:100%;height:54px"><button class="mj-cta" style="--d:.1s" onClick="{{fresh}}"><span class="mj-w" style="--d:.45s;--u:.5s"><span class="o">Lancer une simulation</span><span class="f" aria-hidden="true">Lancer une simulation</span></span></button></div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"play":{"editor":null,"default":true},"leaving":{"editor":null,"default":false},"onNav":{"editor":null},"draft":{"editor":null},"email":{"editor":null},"sent":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pc: '' }; this.batch = true; this.redo = false; }
  act() { return this.props.play === undefined ? true : !!this.props.play; }
  componentDidMount() { setTimeout(() => this.check(), 40); }
  componentDidUpdate(pp) {
    if (this.redo) { this.redo = false; this.reset(); setTimeout(() => this.check(), 20); }
    const was = pp.play === undefined ? true : !!pp.play, now = this.act();
    if (!was && now) { this.batch = true; setTimeout(() => this.check(), 60); }
    if (was && !now) { this.reset(); if (this.sc) this.sc.scrollTop = 0; }
  }
  check() {
    const root = this.root, sc = this.sc;
    if (!root || !sc || !this.act()) return;
    const bottom = sc.getBoundingClientRect().bottom;
    let k = 0;
    root.querySelectorAll('[data-rv]:not(.rv)').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.top < bottom - 36) { el.style.setProperty('--b', (this.batch ? k * 0.18 : 0.05).toFixed(2) + 's'); el.classList.add('rv'); k++; }
    });
    this.batch = false;
  }
  reset() { const root = this.root; if (!root) return; root.querySelectorAll('[data-rv]').forEach((el) => el.classList.remove('rv')); void root.offsetWidth; }
  renderVals() {
    const d = this.props.draft || null, sent = !!this.props.sent;
    const A = '/_blob/c145ad0fe8cc59b423f374ceb0618733', B = '/_blob/c1aa6596dc4bef1d2aa222836cdecd2d', C = '/_blob/ab41a6e00573f6010cc7a04a2e70fc27', D = '/_blob/098613cec7da82581cef70ebd0e18367', E = '/_blob/2aa4aa217df0a00c1dd1ba248338bd5a';
    const P = { mar: [A, '50% 10%', 'Mariage', '', 'Les mariés devant le château'], eng: [C, '30% 50%', 'Séance engagement', '', 'Couple debout dans un grand champ'], fam: [B, '62% 50%', 'Famille lifestyle', 'nb', 'Couple enlacé dans un champ'], ann: [D, '50% 38%', 'Anniversaire', 'nb', 'Les mariés enlacés'], evt: [E, '50% 30%', 'Événementiel', '', 'Baiser sur la joue'], cul: [A, '70% 65%', 'Culinaire & studio', 'nb', 'Détail'] };
    const p = P[d && d.sid] || P.mar;
    return {
      rcls: (this.act() ? 'go' : '') + (this.props.leaving ? ' out' : ''),
      rootRef: (el) => { this.root = el; }, scRef: (el) => { this.sc = el; },
      scroll: () => this.check(), pc: this.state.pc,
      who: this.props.email || 'connecté',
      introA: d ? (sent ? 'Votre demande a bien été envoyée.' : 'Bienvenue. Votre dossier est déjà prêt :') : 'Vous n’avez pas encore de dossier.',
      introB: d ? (sent ? 'Le photographe l’examine : réponse sous [48 h].' : 'il reprend votre simulation, il reste à le compléter.') : 'Lancez une simulation pour en créer un.',
      hasDraft: !!d, noDraft: !d,
      src: p[0], pos: p[1], svcT: p[2], nb: p[3], alt: p[4],
      recap: d ? d.recap : '', ttc: d ? d.ttc : '',
      status: sent ? 'Soumis · en cours d’examen' : 'Brouillon · à compléter', n1: sent ? 'on' : '', c1: sent ? '#0D0E10' : '#4B4D52',
      priceL: sent ? 'à confirmer' : 'à partir de', ctaL: sent ? 'Voir mon dossier' : 'Compléter mon dossier', canEdit: !sent,
      open: () => { if (this.props.onNav) this.props.onNav('dossier'); },
      edit: () => { if (this.props.onNav) this.props.onNav('simulateur'); },
      fresh: () => { if (this.props.onNav) this.props.onNav('simulateur'); }
    };
  }
}
</script>
