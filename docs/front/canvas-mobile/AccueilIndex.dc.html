<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil mobile — Index</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.p{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:#0D0E10;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%,rgba(20,18,16,0) 52%,rgba(20,18,16,.10) 78%,rgba(20,18,16,.24) 100%)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#4B4D52}
.ser{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.wr{display:inline-block;animation:wIn 1.3s cubic-bezier(.6,.1,.3,1) both}
@keyframes wIn{from{clip-path:inset(-20px 100% -20px 0)}to{clip-path:inset(-20px -20px -20px 0)}}
.hl{height:1px;background:rgba(13,14,16,.22);animation:lineIn 1.1s ease both}
@keyframes lineIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ln rect,.ln path{fill:none;stroke:#0D0E10;stroke-width:1.5px;stroke-linecap:round;stroke-dasharray:100 102;stroke-dashoffset:101;animation:drawS 1.4s ease-in-out both}
@keyframes drawS{from{stroke-dashoffset:101}to{stroke-dashoffset:0}}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:dev 2.6s ease both}
.ph.nb{animation:devNB 2.6s ease both}
@keyframes dev{0%{opacity:0;filter:grayscale(1) contrast(1.05)}38%{opacity:1;filter:grayscale(1) contrast(1.05)}100%{opacity:1;filter:grayscale(0) contrast(1)}}
@keyframes devNB{0%{opacity:0;filter:grayscale(1) contrast(1.05)}45%{opacity:1;filter:grayscale(1) contrast(1.05)}100%{opacity:1;filter:grayscale(1) contrast(1.05)}}
@keyframes souffle{0%{width:28px}50%{width:46px}100%{width:28px}}
@keyframes habille{from{opacity:0}to{opacity:1}}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(250,248,244,.86) 55%,rgba(240,237,231,.9) 100%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 16px 32px -12px rgba(20,18,16,.30),0 4px 10px -3px rgba(20,18,16,.16),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,18,16,.06),inset 0 -12px 18px -12px rgba(20,18,16,.10);animation:habille 1.8s ease 1.2s both}
.encre{border:0;color:#F4F2EE;font:600 16px Inter,sans-serif;cursor:pointer;background:radial-gradient(35% 25% at 30% 20%,rgba(255,255,255,.14),rgba(255,255,255,0)),url(/_blob/ed07de6673f5b97f3f81d1a4ab4817c0),#0D0E10;background-blend-mode:normal,overlay,normal;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1.5px 0 rgba(0,0,0,.6),0 14px 24px -8px rgba(13,14,16,.55),0 4px 8px -2px rgba(13,14,16,.3)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;background:none;border:0;padding:0;cursor:pointer;color:#0D0E10;text-align:left;position:relative}
.menu{position:absolute;inset:0;background:rgba(255,255,255,.97);animation:habille .45s ease both}
.big{display:block;font:300 38px/1.25 Inter,sans-serif;letter-spacing:-.02em;color:#0D0E10;text-decoration:none;min-height:56px}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s !important;animation-delay:0s !important}}
</style>
</helmet>
<div class="p">
  <div class="vg"></div>

  <!-- En-tête -->
  <div style="position:absolute;left:22px;right:22px;top:22px;height:48px;display:flex;align-items:center;justify-content:space-between">
    <div style="position:relative;padding-bottom:7px">
      <div style="font:500 18px Inter,sans-serif;letter-spacing:-.01em">Ernest H.</div>
      <div style="position:absolute;left:0;bottom:0;height:2px;width:28px;background:#3AA6B5;border-radius:2px;animation:souffle 5s ease-in-out 3s infinite"></div>
    </div>
    <button class="glass" onClick="{{openMenu}}" aria-label="Ouvrir le menu" style="width:48px;height:48px;border-radius:24px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D0E10" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h11"/></svg>
    </button>
  </div>

  <!-- Accroche courte -->
  <div style="position:absolute;left:22px;right:60px;top:92px;font-weight:300;font-size:22px;line-height:1.2;letter-spacing:-.015em;filter:drop-shadow(0 5px 7px rgba(20,18,16,.14))">
    <div class="wr">Un regard, <span class="ser" style="font-size:25px">un instant,</span> une histoire.</div>
  </div>

  <!-- Index des services : la ligne ouverte montre sa photo -->
  <div style="position:absolute;left:22px;right:22px;top:158px">
    <sc-for list="{{services}}" as="s" hint-placeholder-count="6">
      <div>
        <div class="hl" style="animation-delay:{{s.d}}"></div>
        <button class="row" onClick="{{s.pick}}" aria-expanded="{{s.on}}">
          <span class="mono" style="width:26px">{{s.num}}</span>
          <span style="font-size:{{s.fs}}px;font-weight:300;letter-spacing:-.02em;flex:1">{{s.label}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D0E10" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="{{s.icon}}"/></svg>
        </button>
        <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
          <div style="padding:2px 0 18px">
            <div style="position:relative;width:346px;height:172px;background:#17140f;box-shadow:0 20px 36px -16px rgba(20,18,16,.4),0 6px 12px -4px rgba(20,18,16,.18)">
              <div style="position:absolute;inset:0;overflow:hidden"><img class="{{s.cls}}" src="{{s.src}}" alt="{{s.alt}}" style="object-position:{{s.pos}}"></div>
              <svg class="ln" style="position:absolute;inset:-6px;overflow:visible" width="358" height="184" viewBox="0 0 358 184" aria-hidden="true"><rect x="0" y="0" width="358" height="184" pathLength="100"/></svg>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
              <div class="mono">à partir de [prix] €</div>
              <a href="#galerie" style="font:500 14px Inter,sans-serif;color:#0D0E10;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;text-decoration-color:#3AA6B5;min-height:44px;display:flex;align-items:center">Voir la galerie</a>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <div class="hl" style="animation-delay:1.1s"></div>
  </div>

  <!-- CTA pleine largeur -->
  <button class="encre" style="position:absolute;left:22px;right:22px;bottom:22px;height:56px;border-radius:28px">Créer mon devis</button>

  <!-- Menu plein écran : apparaît en fondu, jamais en glissant -->
  <sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
    <div class="menu">
      <div style="position:absolute;left:22px;right:22px;top:22px;height:48px;display:flex;align-items:center;justify-content:space-between">
        <div class="mono">Menu</div>
        <button onClick="{{closeMenu}}" aria-label="Fermer le menu" style="width:48px;height:48px;border-radius:24px;border:1.5px solid #0D0E10;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0E10" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div style="position:absolute;left:22px;right:22px;top:130px">
        <a class="big" href="#galerie"><span class="mono" style="margin-right:12px">01</span>Galerie</a>
        <a class="big" href="#services"><span class="mono" style="margin-right:12px">02</span>Services</a>
        <a class="big" href="#apropos"><span class="mono" style="margin-right:12px">03</span>À <span class="ser" style="font-size:42px">propos</span></a>
        <a class="big" href="#contact"><span class="mono" style="margin-right:12px">04</span>Contact</a>
        <div style="height:1px;background:rgba(13,14,16,.22);margin:22px 0 14px"></div>
        <a href="#dossiers" style="font:400 16px Inter,sans-serif;color:#0D0E10;display:flex;align-items:center;min-height:48px">Mes dossiers</a>
      </div>
      <button class="encre" style="position:absolute;left:22px;right:22px;bottom:22px;height:56px;border-radius:28px">Créer mon devis</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0, menu: false }; }
  renderVals() {
    const A = '/_blob/c145ad0fe8cc59b423f374ceb0618733', B = '/_blob/c1aa6596dc4bef1d2aa222836cdecd2d', C = '/_blob/ab41a6e00573f6010cc7a04a2e70fc27', D = '/_blob/098613cec7da82581cef70ebd0e18367', E = '/_blob/2aa4aa217df0a00c1dd1ba248338bd5a';
    const S = [
      { label: 'Mariages', src: C, pos: '30% 50%', alt: 'Couple debout dans un grand champ' },
      { label: 'Engagement', src: B, pos: '60% 40%', alt: 'Couple enlacé dans un champ' },
      { label: 'Famille lifestyle', src: A, pos: '50% 22%', alt: 'Les mariés devant le château' },
      { label: 'Anniversaires', src: D, pos: '50% 38%', alt: 'Les mariés enlacés, bouquet au premier plan', nb: true },
      { label: 'Événementiel', src: E, pos: '50% 30%', alt: 'Baiser sur la joue' },
      { label: 'Culinaire & studio', src: A, pos: '70% 65%', alt: 'Détail de la mariée', nb: true }
    ];
    const i = this.state.i;
    return {
      menu: this.state.menu,
      openMenu: () => this.setState({ menu: true }),
      closeMenu: () => this.setState({ menu: false }),
      services: S.map((s, k) => ({
        ...s, num: '0' + (k + 1), on: k === i, d: (0.3 + k * 0.12) + 's',
        fs: k === i ? 32 : 26,
        icon: k === i ? 'M12 5l0 0' : 'M13 6l6 6-6 6',
        cls: 'ph' + (s.nb ? ' nb' : ''),
        pick: () => this.setState({ i: k })
      }))
    };
  }
}
</script>
</body>
</html>
