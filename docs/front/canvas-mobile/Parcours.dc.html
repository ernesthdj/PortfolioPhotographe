<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Parcours mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pc-s{position:absolute;inset:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FFFFFF">
  <!-- Les trois écrans restent chargés en permanence (aucun chargement visible). Un seul est visible et actif ; les autres sont au repos, entièrement dessinés « à zéro ». -->
  <div class="pc-s" style="visibility:{{pi.vis}}">
    <dc-import name="PIntro" play="{{pi.play}}" on-done="{{done}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{pa.vis}}">
    <dc-import name="PAccueil" play="{{pa.play}}" leaving="{{pa.leaving}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{pg.vis}}">
    <dc-import name="PGalerie" play="{{pg.play}}" leaving="{{pg.leaving}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { screen: 'intro', leaving: false }; }
  componentWillUnmount() { clearTimeout(this.t); }
  // Changement de page : la page courante se décompose (≈ .45 s), PUIS la suivante se dessine. Jamais d'apparition directe.
  nav(target) {
    const { screen, leaving } = this.state;
    if (leaving || target === screen) return;
    this.setState({ leaving: true });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ screen: target, leaving: false }), 650);
  }
  renderVals() {
    const { screen, leaving } = this.state;
    const mk = (id) => ({ vis: screen === id ? 'visible' : 'hidden', play: screen === id, leaving: leaving && screen === id });
    return {
      pi: mk('intro'), pa: mk('accueil'), pg: mk('galerie'),
      nav: (t) => this.nav(t),
      done: () => this.setState({ screen: 'accueil', leaving: false })
    };
  }
}
</script>
</body>
</html>
