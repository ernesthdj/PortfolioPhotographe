<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Parcours mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.pc-root,.pc-root *{box-sizing:border-box}
.pc-root{--E:cubic-bezier(.45,0,.2,1);position:relative;width:390px;height:844px;overflow:hidden;background:#FFFFFF;color:#0D0E10;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.pc-s{position:absolute;inset:0}
.pc-mono{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#4B4D52}

/* écriture : contour puis remplissage */
.pc-w{position:relative;display:inline-block;white-space:nowrap}
.pc-w .o{display:block;color:transparent;-webkit-text-stroke:1px currentColor;clip-path:inset(-12px 100% -12px 0)}
.pc-w .f{position:absolute;left:0;top:-.24em;padding:.24em .14em .24em 0;background-color:currentColor;background-image:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(255,255,255,.07) 45%,rgba(255,255,255,0)),url(/_blob/ed07de6673f5b97f3f81d1a4ab4817c0);background-size:70% 60%,120px 120px;background-repeat:no-repeat,repeat;background-position:18% 12%,0 0;background-blend-mode:screen,overlay;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;clip-path:inset(-12px 100% -12px 0)}
.go .pc-w .o{animation:pc-wIn var(--u,.6s) var(--E) var(--d,0s) both}
.go .pc-w .f{animation:pc-wIn var(--u,.6s) var(--E) calc(var(--d,0s) + .25s) both}
.pc-sig{clip-path:inset(-4px 100% -4px 0)}
.go .pc-sig{animation:pc-wIn .3s var(--E) .9s both,pc-souffle 6.5s ease-in-out 4.6s infinite}

/* bannière du haut : Ernest H. seul, sur un fondu blanc, persistante */
.pc-top{position:absolute;z-index:30;left:0;right:0;top:0;height:70px;pointer-events:none;transition:opacity .35s ease}
.pc-top .bg{position:absolute;inset:0;background:linear-gradient(180deg,#fff 52%,rgba(255,255,255,0));opacity:0}
.go .pc-top .bg{animation:pc-habille 1s ease .1s both}
.pc-top a{pointer-events:auto}

/* menu du bas : un seul bloc de verre, persistant, qui grandit vers le haut sur la galerie */
.pc-dock{position:absolute;z-index:30;left:16px;bottom:18px;width:358px;transition:height .5s var(--E),opacity .35s ease}
.pc-dock{perspective:640px}
.pc-glow{opacity:1;position:absolute;border-radius:999px;pointer-events:none;background:radial-gradient(closest-side,rgba(58,166,181,.36),rgba(58,166,181,.16) 58%,rgba(58,166,181,0));filter:blur(5px);transition:left .5s cubic-bezier(.45,0,.2,1),opacity .3s ease}
.pc-tilt{position:absolute;inset:0;transform-origin:50% 55%;will-change:transform}
.pc-spec{position:absolute;inset:0;border-radius:33px;pointer-events:none;opacity:0;transition:opacity .3s ease;background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.7),rgba(255,255,255,0) 42%),radial-gradient(circle at calc(100% - var(--sx,50%)) calc(100% - var(--sy,50%)),rgba(20,18,16,.12),rgba(20,18,16,0) 60%)}
.pc-glass{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(250,248,244,.86) 55%,rgba(240,237,231,.9) 100%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 16px 32px -12px rgba(20,18,16,.30),0 4px 10px -3px rgba(20,18,16,.16),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,18,16,.06),inset 0 -12px 18px -12px rgba(20,18,16,.10);opacity:0}
.go .pc-glass{animation:pc-habille 1.8s ease-in-out .75s both}
.pc-edge{position:absolute;inset:0;border:1.5px solid #0D0E10;border-radius:33px;opacity:0;pointer-events:none}
.go .pc-edge{animation:pc-habille .01s linear 1.2s both}
.pc-ln path{fill:none;stroke:#0D0E10;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 102;stroke-dashoffset:101}
.go .pc-ln.c path{animation:pc-drawS .6s var(--E) .2s both,pc-eteint .01s linear 1.2s forwards}
.pc-ln path.pc-com{stroke-dasharray:6 94;stroke-dashoffset:0;stroke-opacity:0}
.go .pc-ln.c path.pc-com{animation:pc-apparait 1.8s ease-in-out 4.6s both,pc-comete 16s linear 4.6s infinite}
.pc-h2 path{stroke-width:1px;stroke:rgba(13,14,16,.22);stroke-dasharray:100 102;stroke-dashoffset:101;fill:none;transition:stroke-dashoffset .5s var(--E) .1s}
.pc-h2.on path{stroke-dashoffset:0}
.pc-btnw{filter:drop-shadow(0 12px 12px rgba(13,14,16,.38)) drop-shadow(0 3px 4px rgba(13,14,16,.22))}
.pc-cta{display:flex;align-items:center;justify-content:center;border:0;color:#F4F2EE;font:600 14px Inter,sans-serif;cursor:pointer;width:100%;height:100%;background:radial-gradient(35% 25% at 30% 20%,rgba(255,255,255,.14),rgba(255,255,255,0)),url(/_blob/ed07de6673f5b97f3f81d1a4ab4817c0),#0D0E10;background-blend-mode:normal,overlay,normal;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1.5px 0 rgba(0,0,0,.6);clip-path:inset(0 100% 0 0 round 24px)}
.go .pc-cta{animation:pc-rBtn .45s var(--E) 1.4s both}
.pc-nv{flex:1;min-width:0;height:58px;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#0D0E10;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.pc-nv:focus-visible,.pc-chip:focus-visible{outline:2px solid #0D0E10;outline-offset:-3px;border-radius:14px}
.pc-c{position:absolute;left:12px;right:12px;top:0;height:48px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;clip-path:inset(0 100% 0 0);transition:clip-path .55s var(--E) .15s}
.pc-c::-webkit-scrollbar{display:none}
.pc-c{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.pc-c.on{clip-path:inset(0 0 0 0)}
.pc-chip{position:relative;flex:none;width:104px;height:48px;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font:500 14px Inter,sans-serif;color:#0D0E10}
.pc-ic{opacity:0}
.go .pc-ic{animation:pc-habille .6s ease var(--d,0s) both}

@keyframes pc-wIn{from{clip-path:inset(-12px 100% -12px 0)}to{clip-path:inset(-12px -12px -12px 0)}}
@keyframes pc-rBtn{from{clip-path:inset(0 100% 0 0 round 24px)}to{clip-path:inset(0 0 0 0 round 24px)}}
@keyframes pc-drawS{from{stroke-dashoffset:101}to{stroke-dashoffset:0}}
@keyframes pc-habille{from{opacity:0}to{opacity:1}}
@keyframes pc-eteint{from{opacity:1}to{opacity:0}}
@keyframes pc-apparait{from{stroke-opacity:0}to{stroke-opacity:1}}
@keyframes pc-comete{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes pc-souffle{0%{width:28px}50%{width:46px}100%{width:28px}}
@media (prefers-reduced-motion: reduce){.pc-root *{animation-duration:0s !important;animation-delay:0s !important;transition-duration:0s !important}}
</style>
</helmet>
<div class="pc-root {{go}}">
  <!-- Les trois écrans restent chargés en permanence (aucun chargement visible). Un seul est visible et actif. -->
  <div class="pc-s" style="visibility:{{pi.vis}}">
    <dc-import name="PIntro" play="{{pi.play}}" on-done="{{done}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{pa.vis}}">
    <dc-import name="PAccueil" play="{{pa.play}}" leaving="{{pa.leaving}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{pg.vis}}">
    <dc-import name="PGalerie" play="{{pg.play}}" leaving="{{pg.leaving}}" on-nav="{{nav}}" cat="{{cat}}" on-cat="{{onCat}}" on-zoom="{{onZoom}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{ps.vis}}">
    <dc-import name="PServices" play="{{ps.play}}" leaving="{{ps.leaving}}" on-nav="{{nav}}" svc="{{svc}}" on-gallery="{{onGallery}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{pm.vis}}">
    <dc-import name="PSimulateur" play="{{pm.play}}" leaving="{{pm.leaving}}" on-nav="{{nav}}" sid="{{sim}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="pc-s" style="visibility:{{pk.vis}}">
    <dc-import name="PCompte" play="{{pk.play}}" leaving="{{pk.leaving}}" on-nav="{{nav}}" draft="{{draft}}" hint-size="390px,844px"></dc-import>
  </div>

  <!-- Bannière du haut : Ernest H. seul -->
  <div class="pc-top" style="opacity:{{bar.op}}">
    <div class="bg" aria-hidden="true"></div>
    <a href="PAccueil.dc.html" onClick="{{goAccueil}}" aria-label="Ernest H. — accueil" style="position:absolute;left:22px;top:20px;font:500 19px Inter,sans-serif;letter-spacing:-.01em;color:#0D0E10;text-decoration:none">
      <span class="pc-w" style="--d:.25s;--u:.55s"><span class="o">Ernest H.</span><span class="f" aria-hidden="true">Ernest H.</span></span>
    </a>
    <div class="pc-sig" aria-hidden="true" style="position:absolute;left:22px;top:48px;height:2px;width:28px;background:#3AA6B5;border-radius:2px"></div>
    <div class="pc-mono" style="position:absolute;right:22px;top:26px"><span class="pc-w" style="--d:.5s;--u:.6s"><span class="o">Photographe</span><span class="f" aria-hidden="true">Photographe</span></span></div>
  </div>

  <!-- Menu du bas : navigation principale + devis ; sur la galerie le même bloc grandit vers le haut avec la sous-navigation des services -->
  <div class="pc-dock" style="height:{{bar.h}}px;opacity:{{bar.op}};pointer-events:{{bar.pe}}" onPointerDown="{{pd}}" onPointerMove="{{pm}}" onPointerUp="{{pu}}" onPointerCancel="{{pu}}" onPointerLeave="{{pu}}">
    <div class="pc-tilt">
    <div class="pc-glass" style="position:absolute;inset:0;border-radius:33px"></div>
    <svg class="pc-ln c" style="position:absolute;left:0;bottom:0;overflow:visible;pointer-events:none" width="358" height="66" viewBox="0 0 358 66" aria-hidden="true">
      <path pathLength="100" d="M0 33 A33 33 0 0 1 33 0 H325 A33 33 0 0 1 358 33"/>
      <path pathLength="100" d="M0 33 A33 33 0 0 0 33 66 H325 A33 33 0 0 0 358 33"/>
      <path class="pc-com" pathLength="100" d="M0 33 A33 33 0 0 1 33 0 H325 A33 33 0 0 1 358 33 A33 33 0 0 1 325 66 H33 A33 33 0 0 1 0 33 Z" style="stroke:#3AA6B5"/>
    </svg>
    <div class="pc-edge"></div>
    <div class="pc-spec" aria-hidden="true"></div>

    <!-- sous-navigation (galerie seulement) -->
    <div class="pc-c {{subCls}}" ref="{{stripRef}}" role="tablist" aria-label="Filtrer la galerie par service">
      <div style="position:relative;width:728px;height:48px;display:flex">
        <span class="pc-glow" aria-hidden="true" style="top:8px;height:32px;width:92px;left:{{ulx}}px"></span>
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
          <button class="pc-chip" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}"><span style="font-weight:{{c.w}}">{{c.l}}</span></button>
        </sc-for>
      </div>
    </div>
    <svg class="pc-h2 {{subCls}}" style="position:absolute;left:24px;top:49px;overflow:visible;pointer-events:none" width="310" height="2" viewBox="0 0 310 2" aria-hidden="true"><path pathLength="100" d="M0 1H310"/></svg>

    <!-- navigation principale -->
    <div style="position:absolute;left:8px;right:8px;bottom:4px;height:58px;display:flex;align-items:center;gap:0">
      <span class="pc-glow" aria-hidden="true" style="top:7px;height:44px;width:60px;left:{{tabX}}px;opacity:{{tabOp}}"></span>
      <button class="pc-nv" onClick="{{goAccueil}}" aria-current="{{t0}}"><span class="pc-ic" style="--d:.7s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></span><span class="pc-w" style="--d:.8s;--u:.45s"><span class="o">Accueil</span><span class="f" aria-hidden="true">Accueil</span></span></button>
      <button class="pc-nv" onClick="{{goGalerie}}" aria-current="{{t1}}"><span class="pc-ic" style="--d:.8s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="9"/><rect x="13.5" y="3.5" width="7" height="5"/><rect x="13.5" y="11.5" width="7" height="9"/><rect x="3.5" y="15.5" width="7" height="5"/></svg></span><span class="pc-w" style="--d:.9s;--u:.45s"><span class="o">Galerie</span><span class="f" aria-hidden="true">Galerie</span></span></button>
      <button class="pc-nv" onClick="{{goServices}}" aria-current="{{t2}}"><span class="pc-ic" style="--d:.9s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span class="pc-w" style="--d:1s;--u:.45s"><span class="o">Services</span><span class="f" aria-hidden="true">Services</span></span></button>
      <button class="pc-nv" onClick="{{soon}}"><span class="pc-ic" style="--d:1s"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13"/><path d="M4 7l8 6 8-6"/></svg></span><span class="pc-w" style="--d:1.1s;--u:.45s"><span class="o">Contact</span><span class="f" aria-hidden="true">Contact</span></span></button>
      <div class="pc-btnw" style="flex:none;width:88px;height:48px;margin-left:6px"><button class="pc-cta" onClick="{{goSim}}"><span class="pc-w" style="--d:1.75s;--u:.45s"><span class="o">Mon devis</span><span class="f" aria-hidden="true">Mon devis</span></span></button></div>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { screen: 'intro', leaving: false, cat: 'tout', svc: 'mariages', sim: null, draft: null, zoom: false }; this.lastKey = ''; }
  componentWillUnmount() { clearTimeout(this.t); cancelAnimationFrame(this.raf); cancelAnimationFrame(this.rs); }
  componentDidUpdate() { const k = this.state.screen + ':' + this.state.cat + ':' + this.state.svc; if (this.lastKey !== k) { this.lastKey = k; this.centerCat(); } }
  // --- banderole des catégories : défilement animé (ease-in-out, 0,6 s) ; elle se déroule vers la droite si l'on clique à gauche, vers la gauche si l'on clique à droite ---
  slideTo(btn) {
    const strip = this.strip; if (!strip || !btn) return;
    const max = Math.max(0, strip.scrollWidth - strip.clientWidth);
    const target = Math.max(0, Math.min(max, btn.offsetLeft + btn.offsetWidth / 2 - strip.clientWidth / 2));
    const from = strip.scrollLeft, dist = target - from;
    cancelAnimationFrame(this.rs);
    if (Math.abs(dist) < 1) return;
    if (this.reduced()) { strip.scrollLeft = target; return; }
    const t0 = performance.now(), D = 600;
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const step = (now) => {
      const k = Math.min(1, (now - t0) / D);
      strip.scrollLeft = from + dist * ease(k);
      if (k < 1) this.rs = requestAnimationFrame(step);
    };
    this.rs = requestAnimationFrame(step);
  }
  centerCat() {
    const strip = this.strip; if (!strip) return;
    const chips = strip.querySelectorAll('.pc-chip');
    const g = ['tout', 'mariages', 'engagement', 'famille', 'anniversaires', 'evenementiel', 'culinaire'], v = ['mariages', 'engagement', 'famille', 'anniversaires', 'evenementiel', 'culinaire'];
    const srv = this.state.screen === 'services';
    const idx = (srv ? v : g).indexOf(srv ? this.state.svc : this.state.cat);
    this.slideTo(chips[Math.max(0, idx)]);
  }
  // --- inclinaison 3D du menu : il pivote selon l'endroit où l'on appuie (le point touché s'enfonce), puis revient à plat par un ressort amorti ---
  reduced() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (x) { return false; } }
  tp(e) {
    if (this.reduced()) return;
    const el = e.currentTarget; this.dk = el; this.tl = el.querySelector('.pc-tilt'); this.sp = el.querySelector('.pc-spec');
    if (!this.tl) return;
    this.down = true;
    if (!this.a) this.a = { x: 0, y: 0, s: 1, vx: 0, vy: 0, vs: 0, tx: 0, ty: 0, ts: 1 };
    this.aim(e); this.loop();
  }
  tm(e) { if (this.down) this.aim(e); }
  tu() { if (!this.down) return; this.down = false; if (this.a) { this.a.tx = 0; this.a.ty = 0; this.a.ts = 1; } if (this.sp) this.sp.style.opacity = '0'; this.loop(); }
  aim(e) {
    const r = this.dk.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const nx = Math.max(-1, Math.min(1, (px - 0.5) * 2)), ny = Math.max(-1, Math.min(1, (py - 0.5) * 2));
    this.a.tx = nx * 7; this.a.ty = -ny * 9 * (r.height < 80 ? 1 : 0.8); this.a.ts = 0.985;
    // rotateY positif = côté droit qui s'éloigne ; rotateX positif = haut qui s'éloigne : on enfonce le point touché
    const t = this.a; const tmp = t.tx; t.tx = t.ty; t.ty = tmp;
    if (this.sp) { this.sp.style.setProperty('--sx', (px * 100).toFixed(1) + '%'); this.sp.style.setProperty('--sy', (py * 100).toFixed(1) + '%'); this.sp.style.opacity = '1'; }
  }
  loop() {
    cancelAnimationFrame(this.raf);
    let last = performance.now();
    const step = (now) => {
      const a = this.a, dt = Math.min(0.032, (now - last) / 1000); last = now;
      const K = 190, C = 11;                      // raideur et amortissement du ressort
      const sx = (v, t, vv) => { const acc = -K * (v - t) - C * vv; return acc; };
      a.vx += sx(a.x, a.tx, a.vx) * dt; a.x += a.vx * dt;
      a.vy += sx(a.y, a.ty, a.vy) * dt; a.y += a.vy * dt;
      a.vs += sx(a.s, a.ts, a.vs) * dt; a.s += a.vs * dt;
      if (this.tl) this.tl.style.transform = 'rotateX(' + a.x.toFixed(2) + 'deg) rotateY(' + a.y.toFixed(2) + 'deg) scale(' + a.s.toFixed(4) + ')';
      const calm = Math.abs(a.x - a.tx) < 0.02 && Math.abs(a.y - a.ty) < 0.02 && Math.abs(a.vx) < 0.05 && Math.abs(a.vy) < 0.05 && Math.abs(a.s - a.ts) < 0.0005;
      if (calm && !this.down) { if (this.tl) this.tl.style.transform = ''; return; }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  // Changement de page : la page courante se décompose (≈ .45 s), PUIS la suivante se dessine. Bannière et menu restent en place.
  nav(target, arg) {
    const { screen, leaving } = this.state;
    if (leaving || (target === screen && !arg) || screen === 'intro') return;
    this.setState({ leaving: true });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({
      screen: target, leaving: false, zoom: false,
      cat: target === 'galerie' ? (arg || 'tout') : 'tout',
      svc: target === 'services' ? (arg || 'mariages') : 'mariages',
      sim: target === 'simulateur' ? (arg || null) : null,
      draft: target === 'compte' && arg && typeof arg === 'object' ? arg : null
    }), 650);
  }
  renderVals() {
    const { screen, leaving, cat, svc, sim: simK, draft, zoom } = this.state;
    const mk = (id) => ({ vis: screen === id ? 'visible' : 'hidden', play: screen === id, leaving: leaving && screen === id });
    const GCH = [['tout', 'Tout'], ['mariages', 'Mariages'], ['engagement', 'Engagement'], ['famille', 'Famille'], ['anniversaires', 'Anniversaires'], ['evenementiel', 'Événementiel'], ['culinaire', 'Culinaire']];
    const SCH = [['mariages', 'Mariages'], ['engagement', 'Engagement'], ['famille', 'Famille'], ['anniversaires', 'Anniversaires'], ['evenementiel', 'Événementiel'], ['culinaire', 'Culinaire']];
    const gal = screen === 'galerie', srv = screen === 'services';
    const list = srv ? SCH : GCH, cur = srv ? svc : cat;
    const idx = Math.max(0, list.findIndex((c) => c[0] === cur));
    const tab = screen === 'simulateur' || screen === 'compte' ? -1 : srv ? 2 : gal ? 1 : 0;
    const link = (t) => (e) => { e.preventDefault(); this.nav(t); };
    const hide = zoom || screen === 'intro';
    const sub = (gal || srv) && !leaving;
    return {
      go: screen === 'intro' ? '' : 'go',
      pi: mk('intro'), pa: mk('accueil'), pg: mk('galerie'), ps: mk('services'), pm: mk('simulateur'), pk: mk('compte'),
      draft, cat, svc, sim: simK ? ({ mariages: 'mar', engagement: 'eng', famille: 'fam', anniversaires: 'ann', evenementiel: 'evt', culinaire: 'cul' })[simK] || '' : '',
      nav: (t, a) => this.nav(t, a),
      done: () => this.setState({ screen: 'accueil', leaving: false }),
