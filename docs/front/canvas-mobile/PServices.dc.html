<style>
body{margin:0}
.ms-p,.ms-p *{box-sizing:border-box}
.ms-p{--E:cubic-bezier(.45,0,.2,1);position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:#0D0E10;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ms-sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.ms-sc::-webkit-scrollbar{display:none}
.ms-vg{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(120% 90% at 50% 42%,rgba(20,18,16,0) 55%,rgba(20,18,16,.08) 80%,rgba(20,18,16,.20) 100%)}

.ms-mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#4B4D52}
.ms-ser{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}

/* écriture : contour puis remplissage, goutte d'encre comme tête d'écriture */
.ms-w{position:relative;display:inline-block;white-space:nowrap}
.ms-w .o{display:block;color:transparent;-webkit-text-stroke:1px currentColor;clip-path:inset(-12px 100% -12px 0)}
.ms-w .f{position:absolute;left:0;top:-.24em;padding:.24em .14em .24em 0;background-color:currentColor;background-image:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(255,255,255,.07) 45%,rgba(255,255,255,0)),url(/_blob/ed07de6673f5b97f3f81d1a4ab4817c0);background-size:70% 60%,120px 120px;background-repeat:no-repeat,repeat;background-position:18% 12%,0 0;background-blend-mode:screen,overlay;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;clip-path:inset(-12px 100% -12px 0)}
.ms-tete{position:absolute;left:0;top:50%;width:0;height:0;border-radius:0;background:#0D0E10;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1.5px 0 rgba(0,0,0,.22),0 2px 5px rgba(13,14,16,.22)}
.rv .ms-w .o{animation:ms-wIn var(--u,.6s) var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.rv .ms-w .f{animation:ms-wIn var(--u,.6s) var(--E) calc(var(--b,0s) + var(--d,0s) + .25s) both}
.rv .ms-tete{animation:ms-ne .22s var(--E) max(0s,calc(var(--b,0s) + var(--d,0s) - .22s)) both,ms-ecrit var(--u,.6s) var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.ms-rule{clip-path:inset(-4px 100% -4px 0)}
.rv .ms-rule{animation:ms-wIn .3s var(--E) calc(var(--b,0s) + .1s) both}

/* traits */
.ms-fr{position:absolute;inset:-6px;overflow:visible;pointer-events:none}
.ms-fr rect,.ms-ln path{fill:none;stroke:#0D0E10;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 102;stroke-dashoffset:101}
.rv .ms-fr rect{animation:ms-trace 1.5s var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.rv .ms-ln path{animation:ms-drawS var(--u,.45s) var(--E) calc(var(--b,0s) + var(--d,0s)) both}
.ms-hl{display:block;overflow:visible}
.ms-hl path{stroke-width:1px;stroke:rgba(13,14,16,.24)}

/* photo */
.ms-ph{position:relative;filter:drop-shadow(0 18px 20px rgba(20,18,16,.26)) drop-shadow(0 4px 5px rgba(20,18,16,.14))}
.ms-img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;clip-path:inset(0 100% 0 0)}
.rv .ms-img{animation:ms-rIn .8s var(--E) calc(var(--b,0s) + var(--d,0s) + .45s) both,ms-dev 3.2s ease-in-out calc(var(--b,0s) + var(--d,0s) + .45s) both}
.rv .ms-img.nb{animation:ms-rIn .8s var(--E) calc(var(--b,0s) + var(--d,0s) + .45s) both,ms-devNB 3.2s ease-in-out calc(var(--b,0s) + var(--d,0s) + .45s) both}

.ms-glass{background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(250,248,244,.86) 55%,rgba(240,237,231,.9) 100%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 16px 32px -12px rgba(20,18,16,.30),0 4px 10px -3px rgba(20,18,16,.16),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -2px 0 rgba(20,18,16,.06),inset 0 -12px 18px -12px rgba(20,18,16,.10);opacity:0}
.rv .ms-glass{animation:ms-habille 1.8s ease-in-out calc(var(--b,0s) + var(--d,0s) + .5s) both}
.ms-btnw{filter:drop-shadow(0 12px 12px rgba(13,14,16,.38)) drop-shadow(0 3px 4px rgba(13,14,16,.22))}

.rv .ms-cta{animation:ms-rBtn .45s var(--E) calc(var(--b,0s) + var(--d,0s)) both}

.ms-glow{position:absolute;left:-12px;right:-12px;top:-8px;bottom:-4px;border-radius:999px;background:radial-gradient(closest-side,rgba(58,166,181,.36),rgba(58,166,181,.16) 58%,rgba(58,166,181,0));filter:blur(5px);opacity:0;pointer-events:none}

/* sortie : le contenu se décompose (jamais coupé d'un coup) */
.out .rv .ms-w .o,.out .rv .ms-w .f{animation:ms-wOut .2s var(--E) 0s both}
.out .rv .ms-tete{animation:none}
.out .rv .ms-img{animation:ms-devOut .25s var(--E) 0s both}
.out .rv .ms-fr rect{animation:none}

@keyframes ms-rIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ms-rBtn{from{clip-path:inset(0 100% 0 0 round 26px)}to{clip-path:inset(0 0 0 0 round 26px)}}
@keyframes ms-rBtnOut{from{clip-path:inset(0 0 0 0 round 26px)}to{clip-path:inset(0 100% 0 0 round 26px)}}
@keyframes ms-drawS{from{stroke-dashoffset:101}to{stroke-dashoffset:0}}

@keyframes ms-trace{0%{stroke-dashoffset:101}50%{stroke-dashoffset:0}65%{stroke-dashoffset:0}100%{stroke-dashoffset:-102}}
@keyframes ms-dev{0%{opacity:0;filter:grayscale(1) contrast(1.05)}38%{opacity:1;filter:grayscale(1) contrast(1.05)}100%{opacity:1;filter:grayscale(0) contrast(1)}}
@keyframes ms-devNB{0%{opacity:0;filter:grayscale(1) contrast(1.05)}45%{opacity:1;filter:grayscale(1) contrast(1.05)}100%{opacity:1;filter:grayscale(1) contrast(1.05)}}
@keyframes ms-devOut{0%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
@keyframes ms-habille{from{opacity:0}to{opacity:1}}
@keyframes ms-deshabille{from{opacity:1}to{opacity:0}}
@keyframes ms-ne{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ms-ecrit{0%{left:-14px;top:calc(50% - 5px);width:10px;height:10px;border-radius:5px}15%{left:-2px;top:0;width:3px;height:100%;border-radius:1.5px}85%{left:calc(100% - 2px);top:0;width:3px;height:100%;border-radius:1.5px}100%{left:100%;top:50%;width:0;height:0;border-radius:0}}
@media (prefers-reduced-motion: reduce){.ms-p *{animation-duration:0s !important;animation-delay:0s !important;transition-duration:0s !important}}

<div class="ms-p {{rcls}}" ref="{{rootRef}}">
  <div class="ms-vg" aria-hidden="true"></div>
  <div class="ms-sc" ref="{{scRef}}" onScroll="{{scroll}}">
    <div class="ms-c {{pc}}" style="padding:96px 22px 190px;position:relative">

      <div data-rv="" style="display:flex;align-items:center;gap:12px">
        <span class="ms-rule" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="ms-mono"><span class="ms-w" style="--d:.15s;--u:.6s"><span class="o">Services · {{num}} / 06</span><span class="f" aria-hidden="true">Services · {{num}} / 06</span></span></span>

      <!-- titre -->

        <div data-rv=""><span class="ms-w" style="--d:.1s;--u:.8s"><span class="ms-tete"></span><span class="o">{{t1}}</span><span class="f" aria-hidden="true">{{t1}}</span></span></div>
        <div data-rv=""><span class="ms-w" style="--d:.45s;--u:.8s"><span class="ms-tete"></span><span class="o"><span class="ms-ser" style="font-size:40px">{{t2}}</span></span><span class="f" aria-hidden="true"><span class="ms-ser" style="font-size:40px">{{t2}}</span></span></span></div>
      </div>

      <!-- description -->
      <div data-rv="" style="margin-top:14px;font:400 15px/1.7 Inter,sans-serif;color:#4B4D52">
        <div><span class="ms-w" style="--d:.1s;--u:.7s"><span class="o">{{d1}}</span><span class="f" aria-hidden="true">{{d1}}</span></span></div>

      <!-- tarifs : lignes sur filets tracés -->

        <sc-for list="{{lines}}" as="r" hint-placeholder-count="4">
          <div>
            <svg class="ms-ln ms-hl" width="346" height="2" viewBox="0 0 346 2" aria-hidden="true"><path pathLength="100" d="M0 1H346" style="--d:{{r.d}};--u:.9s"/></svg>

            </div>
          </div>
        </sc-for>
        <svg class="ms-ln ms-hl" width="346" height="2" viewBox="0 0 346 2" aria-hidden="true"><path pathLength="100" d="M0 1H346" style="--d:.7s;--u:.9s"/></svg>
      </div>

      <!-- exemple de simulation : la matière de verre arrive une fois le trait fini -->
      <div data-rv="" style="margin-top:26px;position:relative;height:118px">
        <div class="ms-glass" style="position:absolute;inset:0;border-radius:24px"></div>
        <svg class="ms-ln" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="346" height="118" viewBox="0 0 346 118" aria-hidden="true">
          <path pathLength="100" d="M0 59 V24 A24 24 0 0 1 24 0 H322 A24 24 0 0 1 346 24 V59" style="--d:.1s;--u:.7s"/>
          <path pathLength="100" d="M0 59 V94 A24 24 0 0 0 24 118 H322 A24 24 0 0 0 346 94 V59" style="--d:.1s;--u:.7s"/>
        </svg>
        <div style="position:absolute;left:22px;top:20px">
          <div class="ms-mono"><span class="ms-w" style="--d:.8s;--u:.6s"><span class="o">Exemple de simulation</span><span class="f" aria-hidden="true">Exemple de simulation</span></span></div>
          <div style="margin-top:6px;font:300 38px/1.1 Inter,sans-serif;letter-spacing:-.03em"><span class="ms-w" style="--d:1s;--u:.7s"><span class="o">≈ [prix] €</span><span class="f" aria-hidden="true">≈ [prix] €</span></span></div>
          <div class="ms-mono" style="margin-top:6px;font-size:10px"><span class="ms-w" style="--d:1.3s;--u:.6s"><span class="o">[2 h · 1 lieu · 15 km]</span><span class="f" aria-hidden="true">[2 h · 1 lieu · 15 km]</span></span></div>
        </div>
      </div>

      <!-- actions -->
      <div data-rv="" style="margin-top:24px">
        <div class="ms-btnw" style="width:100%;height:52px"><button class="ms-cta" style="--d:.1s" onClick="{{sim}}"><span class="ms-w" style="--d:.45s;--u:.5s"><span class="o">Simuler ma journée</span><span class="f" aria-hidden="true">Simuler ma journée</span></span></button></div>
        <div style="margin-top:10px;display:flex;justify-content:center">
          <button class="ms-more" onClick="{{gallery}}" aria-label="Voir la galerie du service">
            <span style="position:relative;display:inline-block"><span class="ms-glow" style="--d:.7s" aria-hidden="true"></span><span class="ms-w" style="--d:.5s;--u:.5s"><span class="o">Voir la galerie</span><span class="f" aria-hidden="true">Voir la galerie</span></span></span>
            <svg class="ms-ln" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="100" d="M5 12h14M13 6l6 6-6 6" style="--d:.8s;--u:.4s"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"play":{"editor":null,"default":true},"leaving":{"editor":null,"default":false},"onNav":{"editor":null},"svc":{"editor":null},"onGallery":{"editor":null},"$preview":{"width":390,"height":844}}'>

  }
  // changement de service : le contenu se décompose (0,23 s), puis se réécrit
  pick(k, instant) {
