  justifie(list, W, rowH, gap, padTop, legende) {

      { src: '/_blob/6832670aa81d041033100b28a2e4313e', alt: 'Couple enlacé dans un champ', r: 1400 / 600 },
      { src: '/_blob/4e34f55900df112fe7752da33bc917a5', alt: 'Les mariés sur un balcon en fer forgé', r: 2 / 3 },
      { src: '/_blob/2b6e173fdf036442185ceb85aa49021f', alt: 'Baiser sur la joue', r: 2 / 3 },
      { src: '/_blob/9b725673bcdd88ed30e17af8444a53f5', alt: 'Couple debout dans un grand champ', r: 1400 / 600 }
    ];
    const SVC = ['Mariages', 'Engagement', 'Famille lifestyle', 'Anniversaires', 'Événementiel', 'Culinaire & studio'];
    const EVT = [
      { svc: 0, tag: 'Mariage · [Lieu] · 2026', txt: '[Une phrase sur la journée]', ph: [0, 1, 2, 3, 4, 2], who: '[Prénoms des mariés]' },
      { svc: 0, tag: 'Mariage · [Lieu] · 2025', txt: '[Une phrase sur la journée]', ph: [4, 3, 0, 1] },
      { svc: 1, tag: 'Engagement · [Lieu]', txt: '[Une phrase sur la séance]', ph: [1, 4, 2, 0] },
      { svc: 2, tag: 'Famille · [Lieu]', txt: '[Une phrase sur la séance]', ph: [3, 4, 0, 1, 2] },
      { svc: 3, tag: 'Anniversaire · [Lieu]', txt: '[Une phrase sur la fête]', ph: [2, 0, 1, 3] },
      { svc: 4, tag: 'Événement · [Lieu]', txt: '[Une phrase sur l\'événement]', ph: [1, 2, 3, 4, 0] },
      { svc: 5, tag: 'Culinaire · [Maison]', txt: '[Une phrase sur le shooting]', ph: [0, 4, 3, 1] }
    ];
    const TEM = ['« [Ce que le client a ressenti en découvrant les photos.] »', '« [Un moment qu\'il revit grâce aux images.] »'];
    const st = this.state, alt = st.n % 2 === 1, first = st.n === 0;
    const sep = `drawS ${.8 * K}s ${E} 0s both`;
    const a = {
      sep, logo: T(.3, .8), sig: `wIn ${.5 * K}s ${E} ${1.35 * K}s both`,
      n0: T(.5, .45), n1: T(.6, .45), n2: T(.7, .45), n3: T(.8, .45), navU: `wIn ${.5 * K}s ${E} ${1.2 * K}s both`,
      hFl: `habille 1s ease ${.9 * K}s both`, hCta: T(1.3, .45),
      eyeL: `wIn ${.4 * K}s ${E} ${.6 * K}s both`, eye: T(.75, .6, alt), h1: T(.9, .9, alt), h2: T(1.15, .9, alt),
      pillL: `drawS ${.9 * K}s ${E} ${1.1 * K}s both`, pill: `habille 1.8s ease-in-out ${2.0 * K}s both`,
      pillC: `apparait 1.8s ease-in-out 5s both, comete 20s linear 5s infinite`,
      indA: `wIn ${.5 * K}s ${E} ${2.6 * K}s both`,
      dFl: `habille 1.2s ease ${2.6 * K}s both`, dCta: T(3.0, .45)
    };
    const txt = st.svc < 0 ? { eye: 'Galerie', h1: 'Tous les', h2: 'instants.' } : { eye: 'Galerie', h1: SVC[st.svc], h2: 'en images.' };
    const counts = SVC.map((_, i) => EVT.filter(e => e.svc === i).reduce((t, e) => t + e.ph.length, 0));
    const total = counts.reduce((t, c) => t + c, 0);
    const filtres = [{ t: 'Tout', i: -1 }].concat(SVC.map((t, i) => ({ t, i }))).map((f, k) => ({
      t: f.t, n: String(f.i < 0 ? total : counts[f.i]).padStart(2, '0'), on: st.svc === f.i,
      cls: st.svc === f.i ? 'filtre' : 'filtre off', a: T(1.6 + k * .1, .45),
      pick: () => this.changer(f.i)
    }));
    const fi = st.svc + 1;
    const ind = { y: Math.round(316 + fi * 41 + 34), w: Math.round(filtres[fi].t.length * 9.2) };
    const D0 = first ? 1.6 * K : .1;
    const frame = (w, h) => `M1 1 L${w + 1} 1 L${w + 1} ${h + 1} L1 ${h + 1} Z`;
    const evts = EVT.filter(e => st.svc < 0 || e.svc === st.svc);
    const reperes = [], vues = [], flat = [], temoins = [];
    let y = 6, k = 0;
    evts.forEach((e, ei) => {
      const d0 = D0 + ei * .5;
      reperes.push({ y, tag: e.tag, txt: e.txt,
        a: { o: `${alt ? 'wIn2' : 'wIn'} .5s ${E} ${d0.toFixed(2)}s both`, f: `${alt ? 'wIn2' : 'wIn'} .5s ${E} ${(d0 + .16).toFixed(2)}s both` },
        b: { o: `${alt ? 'wIn2' : 'wIn'} .7s ${E} ${(d0 + .2).toFixed(2)}s both`, f: `${alt ? 'wIn2' : 'wIn'} .7s ${E} ${(d0 + .36).toFixed(2)}s both` },
        l: `drawS .9s ${E} ${(d0 + .1).toFixed(2)}s both` });
      y += 52;
      const items = e.ph.map(p => ({ r: PH[p].r, p }));
      const seed = (ei * 7 + (st.sh || 0) * 3 + 5) % 97;
      const pos = 1 + (seed % items.length);
      items.splice(pos, 0, { r: 1.5, temoin: true });
      const L = this.justifie(items, 980, 220, 14, 0, 0);
      let j = 0;
      L.items.forEach((v) => {
        if (v.temoin) {
          const tb = d0 + .3 + e.ph.length * .1 + .4, qi = st.tq % TEM.length, qa = st.tq % 2 === 1;
          const wr = (dl, d) => st.tqOut
            ? { o: `wOut .35s ${E} .04s both`, f: `wOut .32s ${E} 0s both` }
            : st.tq === 0
              ? { o: `${alt ? 'wIn2' : 'wIn'} ${d}s ${E} ${(tb + dl).toFixed(2)}s both`, f: `${alt ? 'wIn2' : 'wIn'} ${d}s ${E} ${(tb + dl + .18).toFixed(2)}s both` }
              : { o: `${qa ? 'wIn2' : 'wIn'} ${d}s ${E} ${(dl * .5).toFixed(2)}s both`, f: `${qa ? 'wIn2' : 'wIn'} ${d}s ${E} ${(dl * .5 + .18).toFixed(2)}s both` };
          const pad = Math.round(Math.max(22, v.h * .12)), fs = Math.round(Math.max(17, Math.min(26, v.h * .095)));
          temoins.push({ x: v.x, y: v.y + y, w: v.w, h: v.h, sw: v.w + 2, sh: v.h + 2, d: frame(v.w, v.h),
            p: pad, qt: pad, tw: v.w - pad * 2, fs: fs + 3,
            quote: TEM[qi], who: '— ' + (e.who || '[Prénom du client]'), pos: (qi + 1) + ' / ' + TEM.length,
            line: `${alt ? 'trace2' : 'trace'} 2.2s ${E} ${tb.toFixed(2)}s both`, fill: `${alt ? 'habille2' : 'habille'} 1.6s ease-in-out ${(tb + .6).toFixed(2)}s both`,
            mark: `${alt ? 'wIn2' : 'wIn'} .5s ${E} ${(tb + .9).toFixed(2)}s both`, q: wr(1.2, 1.1), c: wr(1.7, .6) });
          return;
        }
        const dl = (d0 + .3 + j * .1).toFixed(2), nb = k % 4 === 2, idx = flat.length;
        flat.push({ p: v.p, tag: e.tag, x: v.x, y: v.y + y, w: v.w, h: v.h });
        vues.push({ ...v, nb, y: v.y + y, src: PH[v.p].src, label: 'Agrandir la photo ' + (idx + 1),
          anim: `${nb ? (alt ? 'devNB2' : 'devNB') : (alt ? 'dev2' : 'dev')} 2.4s ease-in-out ${dl}s both`,
          tr: `${alt ? 'trace2' : 'trace'} 2s ${E} ${dl}s both`,
          sx: v.x - 1, sy: v.y + y - 1, sw: v.w + 2, sh: v.h + 2, d: frame(v.w, v.h),
          open: () => this.ouvrir(idx) });
        k++; j++;
      });
      y += L.H + 36;
    });
    const zoneH = Math.max(740, y + 20);
    const dissolve = st.lb !== null && st.lbSt !== 'closing';
    if (st.out || dissolve) {
      const wo = (k2) => ({ o: `wOut .3s ${E} ${(k2 * .02).toFixed(2)}s both`, f: `wOut .28s ${E} ${(k2 * .02).toFixed(2)}s both` });
      vues.forEach((v, i2) => { v.anim = `devOut .3s ease-out ${(i2 * .02).toFixed(2)}s forwards`; v.tr = 'none'; });
      reperes.forEach((r, i2) => { r.a = wo(i2); r.b = wo(i2); r.l = 'none'; });
      temoins.forEach((t, i2) => { t.fill = `devOut .3s ease-out ${(i2 * .03).toFixed(2)}s forwards`; t.q = wo(i2); t.c = wo(i2); t.mark = `wOut .25s ${E} 0s both`; t.line = 'none'; });
      a.eye = { o: `wOut .3s ${E} .04s both`, f: `wOut .28s ${E} 0s both` }; a.h1 = a.eye; a.h2 = a.eye;
      if (dissolve) {
        const wo2 = { o: `wOut .3s ${E} .1s both`, f: `wOut .28s ${E} .06s both` };
        a.sep = `undrawS .5s ${E} .1s both`; a.pillL = `undrawS .5s ${E} .15s both`; a.pill = `devOut .35s ease-out 0s both`;
        a.pillC = `eteint .3s ease forwards`; a.indA = `wOut .25s ${E} 0s both`; a.eyeL = `wOut .25s ${E} 0s both`;
        a.logo = wo2; a.n0 = wo2; a.n1 = wo2; a.n2 = wo2; a.n3 = wo2; a.navU = `wOut .25s ${E} 0s both`; a.sig = `wOut .25s ${E} 0s both`;
        a.hFl = `devOut .3s ease-out 0s both`; a.hCta = wo2; a.dFl = `devOut .3s ease-out 0s both`; a.dCta = wo2;
        filtres.forEach(fl => { fl.a = wo2; });
      }
    }
    this.rects = flat.map(f => ({ x: f.x, y: f.y, w: f.w, h: f.h }));
    let lb = { on: false };
    if (st.lb !== null && flat[st.lb]) {
      const f = flat[st.lb], p = PH[f.p], w0 = Math.min(1180, 720 * p.r), h0 = w0 / p.r;
      const tx = Math.round(720 - w0 / 2), ty = Math.round(440 - h0 / 2), tw = Math.round(w0), th = Math.round(h0);
      const ph = st.lbSt, big = ph === 'to', R = big ? { x: tx, y: ty, w: tw, h: th } : (st.lbR || { x: tx, y: ty, w: tw, h: th });
      const a2 = st.lbN % 2 === 1, box = (d, dl) => ['left', 'top', 'width', 'height'].map(k2 => `${k2} ${d}s ${E} ${dl}s`).join(', ');
      const go = (dd) => { if (st.lbSt === 'to') this.setState({ lb: (st.lb + dd + flat.length) % flat.length, lbN: st.lbN + 1 }); };
      lb = { on: true, ui: big, src: p.src, alt: p.alt, x: R.x, y: R.y, w: R.w, h: R.h,
        sx: tx - 1, sy: ty - 1, sw: tw + 2, sh: th + 2, d: frame(tw, th),
        clip: big ? 'inset(0 0 0 0)' : 'inset(0 0 100% 0)',
        trFond: ph === 'from' ? 'none' : (big ? `clip-path .75s ${E}` : `clip-path .5s ${E} .2s`),
        trBox: ph === 'from' ? 'none' : (big ? box(.8, 0) : box(.7, 0)),
        anim: big && st.lbN > 0 ? `${a2 ? 'dev2' : 'dev'} 2s ease-in-out .1s both` : 'none',
        tr: big ? `${a2 ? 'trace2' : 'trace'} 1.8s ${E} ${st.lbN > 0 ? .05 : .7}s both` : 'none',
        cap: f.tag, num: (st.lb + 1) + ' / ' + flat.length,
        close: () => this.fermer(), prev: () => go(-1), next: () => go(1) };
    }
    if (st.retour && !st.out && !dissolve) {
      const q = (dl) => ({ o: `wIn .35s ${E} ${dl.toFixed(2)}s both`, f: `wIn .35s ${E} ${(dl + .1).toFixed(2)}s both` });
      vues.forEach((v, i2) => { v.anim = `${v.nb ? 'retourNB' : 'retourC'} .45s ease ${(i2 * .015).toFixed(2)}s both`; v.tr = 'none'; });
      reperes.forEach(r => { r.a = q(.1); r.b = q(.15); r.l = `drawS .45s ${E} .1s both`; });
      temoins.forEach(t => { t.q = q(.2); t.c = q(.25); });
      Object.assign(a, { sep: `drawS .45s ${E} 0s both`, pillL: `drawS .45s ${E} .05s both`, pill: `habille .5s ease .2s both`,
        pillC: `apparait .9s ease .7s both, comete 20s linear .7s infinite`, indA: `wIn .3s ${E} .3s both`, eyeL: `wIn .3s ${E} .05s both`,
        logo: q(.05), n0: q(.08), n1: q(.11), n2: q(.14), n3: q(.17), navU: `wIn .3s ${E} .25s both`, sig: `wIn .3s ${E} .25s both`,
        hFl: `habille .4s ease .1s both`, hCta: q(.15), dFl: `habille .4s ease .2s both`, dCta: q(.25), eye: q(.05), h1: q(.1), h2: q(.15) });
      filtres.forEach((fl, i2) => { fl.a = q(.1 + i2 * .02); });
    }
    const zOpen = st.lb !== null;
    return { a, txt, filtres, ind, reperes, vues, zoneH, lb, temoins, zoneOv: zOpen ? 'hidden' : 'auto', zoneSb: zOpen ? 'none' : 'thin' };
  }
}
