<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Ernest H.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
/* Page 404 autonome (servie par Vercel pour toute adresse inconnue) : pas de scène ni de script, chemins absolus seulement. */
html,body{margin:0;height:100%;background:#EEEDE9;color:#0D0E10;font-family:Inter,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 max(24px,8vw);box-sizing:border-box}
.mono{margin:0 0 18px;font:500 11.5px 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#4B4D52}
h1{margin:0;font:300 clamp(34px,5vw,48px)/1.1 Inter,sans-serif;letter-spacing:-.03em}
h1 i{font:italic 400 1.2em/1 'Instrument Serif',serif}
p.t{margin:20px 0 32px;max-width:460px;font:400 15px/1.6 Inter,sans-serif;color:#4B4D52}
a{align-self:flex-start;display:inline-block;padding:13px 28px;border-radius:24px;background:#0D0E10;color:#EEEDE9;font:500 14px Inter,sans-serif;text-decoration:none}
a:focus-visible{outline:2px solid #3AA6B5;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="mono">Erreur 404</p>
  <h1>Cette page <i>n’existe pas.</i></h1>
  <p class="t">L’adresse est peut-être erronée, ou la page a été déplacée.</p>
  <a href="/accueil">Retour à l’accueil</a>
</main>
</body>
</html>
