<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · Modèles de production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/atelier.css">
<link rel="stylesheet" href="../css/pages/atelier-catalogue2.css" data-page-css>
</head>
<body class="atelier" data-module="atelier-modeles" data-famille="atelier">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <!-- La coque persistante (verre + menu) est ajoutée ici par js/lib/atelier-shell.js ; seul #contenu est remplacé par le routeur -->
      <div id="contenu" role="main">

      <p class="mono" style="position:absolute;left:304px;top:52px;margin:0;display:flex;align-items:center;gap:12px">
        <span id="eye-trait" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye"></span>
      </p>
      <h1 style="position:absolute;left:302px;top:76px;margin:0;font:300 36px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1"></span> <span class="w" id="h2"></span>
      </h1>
      <a role="link" tabindex="0" aria-disabled="true" title="Bientôt disponible" class="btn encre" id="nouveau" style="left:calc(1156px + var(--dx));top:72px;width:220px;height:48px;border-radius:24px">+ Nouveau modèle</a>
      <div id="modeles" style="display:contents"></div>

      <div class="verre" id="p2-verre" aria-hidden="true" style="left:628px;top:176px;width:calc(748px + var(--dx));height:696px;opacity:0"></div>
      <div class="champ" id="mnom-champ" style="position:absolute;left:656px;top:200px;width:calc(340px + var(--dx))"><label class="mono" for="mnom">Nom du modèle</label><input id="mnom" type="text" autocomplete="off"></div>
      <p class="mono" style="position:absolute;left:656px;top:296px;margin:0">Étapes, dans l’ordre</p>
      <ol aria-label="Étapes de production" id="etapes" style="list-style:none;margin:0;padding:0">
        <li class="sep" id="livraison" style="position:absolute;left:656px;width:calc(340px + var(--dx));height:40px">
          <span class="mono" id="liv-n" style="position:absolute;left:0;top:14px;color:#0D0E10"></span>
          <span style="position:absolute;left:28px;top:4px;font:400 15px Inter,sans-serif">Livraison</span>
          <span class="note" style="position:absolute;left:28px;top:22px;font-size:11.5px">toujours la dernière · demande un lien de livraison</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" style="position:absolute;right:8px;top:12px;width:16px;height:16px;fill:none;stroke:#4B4D52;stroke-width:1.6;stroke-linecap:round"><path d="M6 11 L18 11 L18 20 L6 20 Z M9 11 L9 8 C9 4 15 4 15 8 L15 11"></path></svg>
        </li>
      </ol>
      <div class="champ" id="net-champ" style="position:absolute;left:656px;width:220px"><label class="mono" for="net">Nouvelle étape</label><input id="net" type="text" autocomplete="off" aria-describedby="mod-err"></div>
      <button type="button" class="mini" id="ajouter-etape" style="position:absolute;left:896px;margin-top:30px">+ Ajouter</button>
      <svg class="ln" aria-hidden="true" style="left:calc(1016px + var(--dx));top:296px;width:2px;height:460px"><path id="l1" pathLength="100" d="M1 0 L1 460" style="stroke-width:1px;stroke:rgba(13,14,16,.16)"></path></svg>
      <p class="mono" style="position:absolute;left:calc(1040px + var(--dx));top:296px;margin:0">Services reliés · délai de livraison</p>
      <div id="services" style="display:contents"></div>
      <p class="note" style="position:absolute;left:calc(1040px + var(--dx));top:690px;width:310px;margin:0;font-size:12.5px">Un modèle modifié vaut pour les shootings pas encore commencés ; ceux en cours gardent leurs étapes.</p>
      <div style="position:absolute;left:656px;top:776px;width:calc(690px + var(--dx))"><p id="mod-err" class="err" style="margin:0" role="alert"></p></div>
      <span class="encre" id="enregistrer-encre" aria-hidden="true" style="position:absolute;left:656px;top:808px;width:240px;height:44px;border-radius:22px;opacity:1"></span><button type="button" class="btn" id="enregistrer" aria-disabled="false" style="left:656px;top:808px;width:240px;height:44px;border-radius:22px">Enregistrer le modèle</button>
      </div><!-- /#contenu -->
    </div>
  </div>
</div>
<script type="module" src="../js/amorce.js"></script>
</body>
</html>
