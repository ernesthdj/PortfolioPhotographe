<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/atelier.css">
</head>
<body class="atelier" data-module="atelier-tableau-de-bord" data-famille="atelier">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <!-- La coque persistante (verre + menu) est ajoutée ici par js/lib/atelier-shell.js ; seul #contenu est remplacé par le routeur -->
      <div id="contenu">

      <p class="mono" style="position:absolute;left:304px;top:52px;margin:0;display:flex;align-items:center;gap:12px">
        <span id="eye-trait" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye"></span>
      </p>
      <h1 style="position:absolute;left:302px;top:76px;margin:0;font:300 36px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1"></span> <span class="w" id="h2"></span>
      </h1>
      <a href="dossiers.html" class="lien mini" id="tous-dossiers" style="position:absolute;right:64px;top:52px">Tous les dossiers →</a>

      <!-- État « Données » -->
      <div id="vue-ok">
        <div id="compteurs" style="display:contents"></div>

        <div class="verre" id="p1-verre" aria-hidden="true" style="left:304px;top:376px;width:calc(522px + var(--dx)*0.5);height:492px;opacity:0"></div>
        <p class="mono" style="position:absolute;left:332px;top:402px;margin:0"><span class="w" id="t1"></span></p>
        <svg class="ln" aria-hidden="true" viewBox="0 0 466 2" preserveAspectRatio="none" style="left:332px;top:428px;width:calc(466px + var(--dx)*0.5);height:2px"><path id="l1" pathLength="100" d="M0 1 L466 1" style="stroke-width:1px;stroke:rgba(13,14,16,.25)"></path></svg>
        <div id="demandes" style="display:contents"></div>
        <a href="demandes.html" class="lien mini" id="toutes-demandes" style="position:absolute;left:332px;top:828px">Toutes les demandes →</a>

        <div class="verre" id="p2-verre" aria-hidden="true" style="left:calc(850px + var(--dx)*0.5);top:376px;width:calc(522px + var(--dx)*0.5);height:492px;opacity:0"></div>
        <p class="mono" style="position:absolute;left:calc(878px + var(--dx)*0.5);top:402px;margin:0"><span class="w" id="t2"></span></p>
        <svg class="ln" aria-hidden="true" viewBox="0 0 466 2" preserveAspectRatio="none" style="left:calc(878px + var(--dx)*0.5);top:428px;width:calc(466px + var(--dx)*0.5);height:2px"><path id="l2" pathLength="100" d="M0 1 L466 1" style="stroke-width:1px;stroke:rgba(13,14,16,.25)"></path></svg>
        <div id="shootings" style="display:contents"></div>
      </div>

      <!-- État « Chargement » -->
      <div id="vue-charge" hidden>
        <div id="squelettes" style="display:contents"></div>
        <p class="mono" role="status" style="position:absolute;left:304px;top:850px;margin:0">Chargement du tableau de bord…</p>
      </div>

      <!-- État « Vide » (MSG09) -->
      <div id="vue-vide" hidden style="position:absolute;left:304px;top:200px;width:640px">
        <p style="margin:0;font:300 30px Inter,sans-serif;letter-spacing:-.02em"><span class="w" id="vide-t"></span></p>
        <p class="note" id="vide-n" style="margin:14px 0 0;font-size:14px">Les dossiers apparaissent ici dès qu’un client soumet un devis. Vérifiez que vos services sont actifs dans le catalogue.</p>
        <a href="services.html" class="lien mini" id="vide-l" style="display:inline-block;margin-top:22px">Ouvrir le catalogue →</a>
      </div>

      <!-- État « Erreur » (MSG10) -->
      <div id="vue-erreur" hidden role="alert" style="position:absolute;left:304px;top:200px;width:640px">
        <p class="mono" style="margin:0;display:flex;align-items:center;gap:10px"><span aria-hidden="true" style="display:block;width:8px;height:8px;border-radius:4px;background:#7A1F33"></span>Erreur</p>
        <p style="margin:12px 0 0;font:300 30px Inter,sans-serif;letter-spacing:-.02em"><span class="w" id="err-t"></span></p>
        <button type="button" class="mini" id="err-r" style="margin-top:22px">Réessayer</button>
      </div>
      </div><!-- /#contenu -->
    </div>
  </div>
</div>
<script type="module" src="../js/amorce.js"></script>
</body>
</html>
