<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · Demandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/atelier.css">
</head>
<body class="atelier" data-module="atelier-demandes" data-famille="atelier">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <!-- La coque (verre + menu) est ajoutée ici par js/lib/atelier-shell.js ; le panneau « Traiter la demande » est ajouté à la scène -->
      <div id="contenu" role="main">
      <p class="mono" style="position:absolute;left:304px;top:52px;margin:0;display:flex;align-items:center;gap:12px">
        <span aria-hidden="true" data-anim="eyeL" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye" data-anim="eye"></span>
      </p>
      <h1 style="position:absolute;left:302px;top:76px;margin:0;font:300 36px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1" data-anim="h1"></span> <span class="w" id="h2" data-anim="h2"></span>
      </h1>

      <div id="vue-ok">
        <div id="items" style="display:contents"></div>
      </div>

      <!-- Vide -->
      <div id="vue-vide" hidden style="position:absolute;left:304px;top:196px;width:700px">
        <p style="margin:0;font:300 30px Inter,sans-serif;letter-spacing:-.02em"><span class="w" data-anim="vT">Aucune demande en attente.</span></p>
        <p class="note" data-anim="nt" style="margin:14px 0 0;font-size:14px">Les demandes des clients (ajout d’un service, changement de fiche technique ou d’adresse) arrivent ici.</p>
      </div>

      <!-- Traitées récemment -->
      <div id="vue-hist" hidden>
        <p class="mono" id="hist-t" data-anim="p2" style="position:absolute;left:304px;margin:0">Traitées récemment</p>
        <div id="hist" style="display:contents"></div>
      </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="../js/amorce.js"></script>
</body>
</html>
