<!doctype html>
<html lang="fr">
<head>
<title>Atelier · Services</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/atelier.css">
<link rel="stylesheet" href="../css/pages/atelier-catalogue.css" data-page-css>
</head>
<body class="atelier" data-module="atelier-services" data-famille="atelier">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <!-- La coque persistante (verre + menu) est ajoutée ici par js/lib/atelier-shell.js ; seul #contenu est remplacé par le routeur -->
      <div id="contenu">
      <p class="mono" style="position:absolute;left:304px;top:52px;margin:0;display:flex;align-items:center;gap:12px">
        <span id="eye-trait" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye"></span>
      </p>
      <h1 style="position:absolute;left:302px;top:76px;margin:0;font:300 36px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1"></span> <span class="w" id="h2"></span>
      </h1>
      <a href="service.html" class="btn encre" id="nouveau" style="left:calc(1156px + var(--dx));top:72px;width:220px;height:48px;border-radius:24px">+ Nouveau service</a>
      <button type="button" class="case" role="checkbox" aria-checked="false" id="arch" style="left:304px;top:166px"><span class="bx" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6.5 L5 9 L10 3"></path></svg></span>Afficher les archivés</button>

      <p id="toast" hidden style="position:absolute;left:560px;top:166px;width:calc(816px + var(--dx));margin:0;display:flex;align-items:flex-start;justify-content:flex-start;gap:10px;font:400 13.5px/1.45 Inter,sans-serif;text-align:left;animation:habille .5s ease both"></p>

      <!-- État « Données » -->
      <div id="vue-ok">
        <div class="mono" style="position:absolute;left:304px;top:216px;width:calc(1072px + var(--dx));height:16px">
          <span style="position:absolute;left:0">Libellé</span><span style="position:absolute;left:calc(286px + var(--dx) * .2)">Catégories</span>
          <span style="position:absolute;left:calc(466px + var(--dx) * .5)">Mode et prix</span><span style="position:absolute;left:calc(856px + var(--dx))">Statut</span>
        </div>
        <svg class="ln" aria-hidden="true" viewBox="0 0 1072 2" preserveAspectRatio="none" style="left:304px;top:238px;width:calc(1072px + var(--dx));height:2px"><path id="l1" pathLength="100" d="M0 1 L1072 1" style="stroke-width:1px;stroke:rgba(13,14,16,.25)"></path></svg>
        <div id="rows" style="display:contents"></div>
      </div>
      <!-- État « Vide » -->
      <div id="vue-vide" hidden style="position:absolute;left:304px;top:260px;width:640px">
        <p style="margin:0;font:300 30px Inter,sans-serif;letter-spacing:-.02em"><span class="w" id="vide-t"></span></p>
      </div>
      <!-- État « Chargement » -->
      <div id="vue-charge" hidden><div id="squelettes" style="display:contents"></div></div>
      </div><!-- /#contenu -->
    </div>
  </div>
</div>
<script type="module" src="../js/amorce.js"></script>
</body>
</html>
