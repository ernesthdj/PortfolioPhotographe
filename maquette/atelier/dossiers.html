<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · Dossiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/atelier.css">
<link rel="stylesheet" href="../css/pages/atelier-dossiers.css" data-page-css>
</head>
<body class="atelier" data-module="atelier-dossiers" data-famille="atelier">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <!-- La coque (verre + menu) est ajoutée ici par js/lib/atelier-shell.js -->
      <div id="contenu">
      <p class="mono" style="position:absolute;left:304px;top:52px;margin:0;display:flex;align-items:center;gap:12px">
        <span id="eye-trait" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye"></span>
      </p>
      <h1 style="position:absolute;left:302px;top:76px;margin:0;font:300 36px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1"></span> <span class="w" id="h2"></span>
      </h1>

      <div class="champ" id="zone-q" style="position:absolute;left:304px;top:156px;width:300px">
        <label class="mono" for="q">Numéro ou email du client</label>
        <input id="q" type="search" autocomplete="off" placeholder="2027-014 ou nom@example.com">
      </div>
      <button type="button" class="mini" id="chercher" style="position:absolute;left:624px;top:188px">Rechercher</button>
      <span class="note" id="q-info" hidden style="position:absolute;left:720px;top:186px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>

      <div role="group" aria-label="Filtrer par date de shooting" id="groupe-dates" style="position:absolute;right:64px;top:180px;display:flex;align-items:center;gap:8px">
        <span class="mono" style="margin-right:6px">Shooting</span>
      </div>
      <div role="group" aria-label="Filtrer par étape" id="groupe-etapes" style="position:absolute;left:304px;top:236px;display:flex;gap:8px"></div>

      <!-- Registre -->
      <div id="vue-ok">
        <div class="mono" style="position:absolute;left:304px;top:300px;width:calc(1072px + var(--dx)*1);height:16px">
          <span style="position:absolute;left:0">N°</span><span style="position:absolute;left:110px">Client</span><span style="position:absolute;left:calc(370px + var(--dx)*0.2)">Prestation</span>
          <span style="position:absolute;left:calc(600px + var(--dx)*0.5)">Shooting</span><span style="position:absolute;left:calc(740px + var(--dx)*0.65)">Étape</span><span style="position:absolute;right:84px">Total TVAC</span>
        </div>
        <svg class="ln" aria-hidden="true" viewBox="0 0 1072 2" preserveAspectRatio="none" style="left:304px;top:322px;width:calc(1072px + var(--dx)*1);height:2px"><path id="l1" pathLength="100" d="M0 1 L1072 1" style="stroke-width:1px;stroke:rgba(13,14,16,.25)"></path></svg>
        <div id="lignes" style="display:contents"></div>
        <p class="note" id="info" style="position:absolute;left:304px;top:808px;margin:0"></p>
        <p class="note" id="legende" style="position:absolute;left:560px;top:808px;margin:0;display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="display:block;width:8px;height:8px;border-radius:4px;background:#3AA6B5"></span>demande en attente</p>
        <button type="button" class="mini" id="prec" aria-disabled="true" style="position:absolute;right:190px;top:810px">← Précédente</button>
        <button type="button" class="mini" id="suiv" aria-disabled="false" style="position:absolute;right:64px;top:810px">Suivante →</button>
      </div>

      <!-- Aucun résultat (MSG11) -->
      <div id="vue-vide" hidden style="position:absolute;left:304px;top:350px;width:640px">
        <p style="margin:0;font:300 30px Inter,sans-serif;letter-spacing:-.02em"><span class="w" id="vide-t"></span></p>
        <button type="button" class="mini" id="effacer" style="margin-top:22px">Effacer les filtres</button>
      </div>

      <!-- Chargement -->
      <div id="vue-charge" hidden>
        <div id="squelettes" style="display:contents"></div>
        <p class="mono" role="status" style="position:absolute;left:304px;top:808px;margin:0">Chargement des dossiers…</p>
      </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="../js/amorce.js"></script>
</body>
</html>
