<!doctype html>
<html lang="fr">
<head>
<title>Atelier · Réductions</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/atelier.css">
<link rel="stylesheet" href="../css/pages/atelier-reductions.css" data-page-css>
</head>
<body class="atelier" data-module="atelier-reductions" data-famille="atelier">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <!-- La coque persistante (verre + menu) est ajoutée ici par js/lib/atelier-shell.js ; seul #contenu est remplacé par le routeur -->
      <div id="contenu" role="main">
      <p class="mono" style="position:absolute;left:304px;top:52px;margin:0;display:flex;align-items:center;gap:12px">
        <span id="eye-trait" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye"></span>
      </p>
      <h1 style="position:absolute;left:302px;top:76px;margin:0;font:300 36px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1"></span> <span class="w" id="h2"></span>
      </h1>
      <p class="note" id="nt" style="position:absolute;left:304px;top:132px;width:640px;margin:0">Chaque réduction se lit comme une phrase : si… alors… sur… Interrupteur pour l’activer ou la couper sans la supprimer.</p>
      <a href="reduction.html" class="btn encre" id="nouveau" style="left:calc(1156px + var(--dx));top:72px;width:220px;height:48px;border-radius:24px">+ Nouvelle réduction</a>

      <div id="zone" class="rz" style="left:288px;top:176px;width:calc(1104px + var(--dx));height:700px">
        <div id="grille" class="rg"></div>
        <p id="vide" hidden style="margin:24px 0 0;font:300 30px Inter,sans-serif;letter-spacing:-.02em">Aucune réduction. Créez la première.</p>
      </div>
      <p id="statut" class="sr-only" role="status"></p>

      <!-- Fenêtre de confirmation de suppression : ouverte par « Supprimer », fermée par Annuler, Échap ou un clic à côté -->
      <div id="supp" hidden>
        <div id="supp-voile" aria-hidden="true" style="position:absolute;left:0;top:0;width:var(--W);height:900px;background:rgba(13,14,16,.28)"></div>
        <div id="supp-dialog" class="verre rm-boite" role="dialog" aria-modal="true" aria-labelledby="supp-t" aria-describedby="supp-d">
          <p class="mono" style="margin:0">Supprimer une réduction</p>
          <p id="supp-t" style="margin:12px 0 0;font:300 24px/1.25 Inter,sans-serif;letter-spacing:-.02em"></p>
          <p id="supp-d" class="note" style="margin:12px 0 0">Elle disparaît de la liste. Les dossiers déjà soumis gardent leurs prix.</p>
          <div class="rm-act">
            <button type="button" class="btn encre" id="supp-oui">Supprimer</button>
            <button type="button" class="mini doux" id="supp-non">Annuler</button>
          </div>
        </div>
      </div>
      </div><!-- /#contenu -->
    </div>
  </div>
</div>
<script type="module" src="../js/amorce.js"></script>
</body>
</html>
