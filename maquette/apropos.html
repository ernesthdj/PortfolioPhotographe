<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À propos · Portrait et récit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/pages/apropos.css" data-page-css>
</head>
<body class="site" data-module="apropos" data-famille="site">
<div id="ecran">
  <div id="scene">
    <div class="vignette" aria-hidden="true"></div>
    <div class="fond" id="fond">
      <div id="contenu">
      <!-- L'en-tête est monté par js/lib/entete.js -->
      <div class="portrait" id="portrait" role="img" aria-label="Emplacement du portrait du photographe" style="left:80px;top:136px;width:calc(420px + var(--g2));height:620px"><span class="w" id="portrait-t"></span></div>
      <svg class="ln" aria-hidden="true" style="left:79px;top:135px;width:calc(422px + var(--g2));height:622px">
        <path id="ph-l" pathLength="100" d="M1 1 L421 1 L421 621 L1 621 Z"></path>
        <path class="comete" id="ph-c" pathLength="100" d="M1 1 L421 1 L421 621 L1 621 Z" style="stroke:#3AA6B5"></path>
      </svg>
      <p class="mono" style="position:absolute;left:80px;top:776px;margin:0;font-size:10.5px;letter-spacing:.08em"><span class="w" id="cap"></span></p>

      <p class="mono" style="position:absolute;left:calc(580px + var(--g2));top:136px;margin:0;display:flex;align-items:center;gap:14px">
        <span id="eye-trait" aria-hidden="true" style="display:block;width:28px;height:1px;background:#D9783A"></span>
        <span class="w" id="eye"></span>
      </p>
      <h1 style="position:absolute;left:calc(578px + var(--g2));top:164px;margin:0;font:300 44px/1.1 Inter,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 6px 9px rgba(20,18,16,.18))">
        <span class="w" id="h1"></span><br><span class="w" id="h2"></span>
      </h1>
      <div id="recit" style="position:absolute;left:calc(580px + var(--g2));top:300px;width:700px"></div>

      <svg class="ln" aria-hidden="true" id="piliers-traits" style="left:0;top:0;width:var(--W);height:900px"></svg>
      <div id="piliers" style="display:contents"></div>

      <p class="mono" style="position:absolute;left:calc(580px + var(--g2));top:638px;margin:0;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.12em">
        <span id="kit-trait" aria-hidden="true" style="display:block;width:20px;height:1px;background:#D9783A"></span>
        <span class="w" id="kit"></span>
      </p>

      <span class="encre" id="c-fl" aria-hidden="true" style="position:absolute;left:calc(580px + var(--g2));top:692px;width:200px;height:48px;border-radius:24px"></span>
      <a href="contact.html" class="btn" style="left:calc(580px + var(--g2));top:692px;width:200px;height:48px;border-radius:24px"><span class="w" id="cta"></span></a>
      <a href="simulateur.html" class="lien" style="position:absolute;left:calc(808px + var(--g2));top:706px;font:500 14px Inter,sans-serif;color:#0D0E10;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px"><span class="w" id="dev"></span></a>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/amorce.js"></script>
</body>
</html>
